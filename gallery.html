
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tortured Devs Department</title>

    <link rel="stylesheet" href="styles/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="siteHeader">
        <a href="index.html" class="logo">The Tortured Devs Department</a>

        <button class="menuToggle" type="button" aria-label="Toggle menu">☰</button>

        <nav id="nav">
            <a href="index.html">the department</a>
            <a href="hobbiesandint.html">the journal</a>
            <a href="gallery.html" class="active">the works</a>
            <a href="about.html">personnel file</a>
        </nav>
    </div>

    <main>

        <div class="galleryHeader">
            <h1>THE WORKS</h1>
        </div>

        <div class="galleryMasonry">

            <button class="galleryCard landscape" type="button"
                data-type="video"
                data-video-id="vAM9sGTKgOc">

                <img src="images/vid1Thumbnail.png" alt="Video 1 thumbnail">

                <span>The Things That Burn When No One Is Watching</span>
                <span class="playIcon" aria-hidden="true">▶</span>

            </button>

            <button class="galleryCard" type="button"
                data-type="image">

                <img src="images/pic1.png" alt="Photo 1">

                <span>The Unwritten Lessons of a Borrowed Future</span>

            </button>

            <button class="galleryCard" type="button"
                data-type="image">

                <img src="images/pic2.png" alt="Photo 2">

                <span>A Most Public Trial of Private Conclusions</span>

            </button>

            <button class="galleryCard landscape" type="button"
                data-type="video"
                data-video-id="2HufLmQmGqs">

                <img src="images/vid2Thumbnail.png" alt="Video 2 thumbnail">

                <span>A Soundtrack for the Things We Couldn't Say. Yearn with Apple Music</span>
                <span class="playIcon" aria-hidden="true">▶</span>

            </button>

            <button class="galleryCard" type="button"
                data-type="carousel">

                <img src="images/pic4.png" alt="Photo 4">
                <img src="images/pic5.png" alt="Photo 5" hidden>

                <span>A Study in Imperfection, or the Art of Becoming</span>

            </button>

            <button class="galleryCard" type="button"
                data-type="image">

                <img src="images/pic3.png" alt="Photo 3">

                <span>A Study in Imperfection, or the Art of Becoming</span>

            </button>

        </div>

    </main>

    <dialog class="imageViewer">

        <div class="viewerContent">

            <button class="viewerPrev" type="button" aria-label="Previous image">‹</button>

            <img class="viewerImage" src="images/pic1.png" alt="Selected gallery image">

            <button class="viewerNext" type="button" aria-label="Next image">›</button>

            <div class="viewerSide">
                <button class="viewerClose" type="button" aria-label="Close image">&times;</button>

                <p class="viewerCaption"></p>
                <p class="viewerCounter"></p>
            </div>

        </div>

    </dialog>

    <dialog class="videoViewer">

        <div class="videoViewerContent">

            <iframe class="viewerVideo" title="Gallery video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            <div class="viewerSide">
                <button class="viewerClose" type="button" aria-label="Close video">&times;</button>

                <p class="viewerCaption"></p>
            </div>

        </div>

    </dialog>

    <script src="script.js"></script>

</body>
</html>
